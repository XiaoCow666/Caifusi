name: Test Caifusi

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number to test its merge ref"
        required: false
        type: string

permissions:
  contents: read
  checks: write

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Create manual PR check
        id: create-check
        if: inputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr }}
        with:
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Test Caifusi (manual PR #${process.env.PR_NUMBER})`,
              head_sha: pull.data.head.sha,
              status: "in_progress",
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: { title: "正在测试 PR 合并版本", summary: "测试完成后将把结果写回该 PR。" },
            });
            core.setOutput("check_id", String(check.data.id));

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        id: tests
        run: npm run build

      - name: Complete manual PR check
        if: always() && inputs.pr != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.create-check.outputs.check_id }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PR_NUMBER: ${{ inputs.pr }}
        with:
          script: |
            const conclusion = process.env.TEST_OUTCOME === "success" ? "success" : "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion,
              output: {
                title: conclusion === "success" ? "PR 合并版本构建通过" : "PR 合并版本构建失败",
                summary: `手动构建 PR #${process.env.PR_NUMBER} 的合并版本，工作流结果：${conclusion}。`,
              },
            });
